<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEPO · Video + GPS</title>
<style>
:root{color-scheme:light;--bg:#f4f4f1;--surface:#fcfcfb;--border:#e2e1dc;--text:#0b0b0b;--text-2:#52514e;--muted:#8a8984;--accent:#eb6834}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--border:#2e2e2b;--text:#fff;--text-2:#c3c2b7;--muted:#8a8984;--accent:#d95926}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--text-2);margin-bottom:22px}
.list{display:grid;gap:12px}
a.card{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;transition:border-color .15s}
a.card:hover{border-color:var(--accent)}
.pitch{flex:none;width:64px;height:40px;border-radius:6px;background:repeating-linear-gradient(90deg,#2c6e40 0 8px,#33794a 8px 16px);position:relative}
.pitch:after{content:"";position:absolute;inset:4px;border:1.5px solid #fff;border-radius:2px;opacity:.85}
.pitch:before{content:"";position:absolute;left:50%;top:4px;bottom:4px;border-left:1.5px solid #fff;opacity:.85}
.t{font-weight:650;font-size:16px}
.m{color:var(--text-2);font-size:13px}
.go{margin-left:auto;color:var(--muted);font-size:20px}
.foot{color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <h1>DEPO · Video + GPS</h1>
  <div class="sub">Partidos con video sincronizado con los datos GPS de cada jugador</div>
  <div class="list">
    <a class="card" href="cirano.html"><span class="pitch"></span><span><div class="t">DEPO vs Cirano · 2R</div><div class="m">URBA Primera A · Segunda rueda · 03/10/2026 · 17 jugadores</div></span><span class="go">›</span></a>
    <a class="card" href="pucara.html"><span class="pitch"></span><span><div class="t">DEPO vs Pucará</div><div class="m">Fecha 22 URBA Primera A · 26/09/2026 · 17 jugadores</div></span><span class="go">›</span></a>
  </div>
  <div class="foot">Plantel superior Deportiva Francesa · 2026</div>
</div>
</body>
</html>
